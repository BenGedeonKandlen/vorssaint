name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  compatibility:
    name: Swift 6.0.3 compatibility
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify toolchain
        run: |
          swiftc --version | grep -F "Apple Swift version 6.0.3"
          test "$(xcrun --sdk macosx --show-sdk-version)" = "15.2"

      - name: Build
        run: ./build.sh

      - name: Selftest
        run: ./build/Vorssaint --selftest

      - name: Unit tests
        run: ./build.sh --test

  build:
    name: Build & selftest
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build
        run: ./build.sh

      - name: Selftest
        run: ./build/Vorssaint --selftest

      - name: Package DMG
        run: ./Tools/make-dmg.sh

      - name: Unit tests
        run: ./build.sh --test

  intel:
    name: Intel build, selftest & tests
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build (native x86_64)
        run: ./build.sh

      - name: Verify architecture
        run: test "$(lipo -archs build/Vorssaint)" = "x86_64"

      - name: Selftest
        run: ./build/Vorssaint --selftest

      - name: Package DMG
        run: ./Tools/make-dmg.sh && ls dist/*-x86_64.dmg

      - name: Unit tests
        run: ./build.sh --test

      - name: Crash diagnostics
        if: failure()
        run: |
          # The full run aborts inside the notch suite on this runner; capture
          # the backtrace of that abort.
          lldb --batch -o run -k "thread backtrace all" -k "quit 1" \
            -- ./build/metrics-tests --suite=notch 2>&1 | grep -v "AttributeGraph" | tail -400 || true

  universal:
    name: Universal build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build (arm64 + x86_64)
        run: ./build.sh --universal

      - name: Verify architectures
        run: |
          for f in build/Vorssaint build/com.vorssaint.utils.fan-control build/libVorssaintNowPlaying.dylib; do
            lipo -archs "$f" | grep -q x86_64
            lipo -archs "$f" | grep -q arm64
          done

      - name: Selftest
        run: ./build/Vorssaint --selftest
